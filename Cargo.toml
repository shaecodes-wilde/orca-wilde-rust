[workspace]
resolver = "2"
exclude = ["crates/wilde-runtime/vendor/portable-pty"]
members = ["crates/wilde-contracts", "crates/wilde-browser", "crates/wilde-domain", "crates/wilde-runtime", "crates/wilde-ui", "crates/wilde-ide", "apps/wilde-desktop"]

[workspace.package]
version = "0.1.0"
edition = "2024"
rust-version = "1.94"
license = "MIT"

[workspace.dependencies]
serde = { version = "=1.0.228", features = ["derive"] }
serde_json = "=1.0.149"

[workspace.lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[workspace.lints.clippy]
all = "warn"



[patch.crates-io]
portable-pty = { path = "crates/wilde-runtime/vendor/portable-pty" }
